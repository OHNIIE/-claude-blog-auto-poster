<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수익형 블로그 오토 포스터</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --pink:#be185d; --pink-soft:#fdf2f8; --pink-line:#fbcfe8;
  --ink:#0f172a; --gray:#475569; --gray-soft:#f1f5f9; --line:#e2e8f0; --bg:#f8fafc;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard',-apple-system,'Malgun Gothic',sans-serif;line-height:1.5;word-break:keep-all}
.wrap{max-width:860px;margin:0 auto;padding:16px 14px 80px}
.card{background:#fff;border-radius:20px;padding:22px;margin-bottom:16px;box-shadow:0 2px 12px rgba(15,23,42,.06)}
h1{font-size:22px;margin:0 0 4px;font-weight:800}
h2{font-size:17px;margin:0;font-weight:800}
h3{font-size:14px;margin:0 0 10px;font-weight:800}
.sub{color:var(--gray);font-size:13px}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tabs{display:flex;background:var(--gray-soft);border-radius:12px;padding:4px}
.tab{border:0;background:transparent;padding:8px 16px;border-radius:9px;font:inherit;font-size:13px;font-weight:700;color:var(--gray);cursor:pointer}
.tab.on{background:#fff;color:var(--pink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.timer{font-size:12px;font-weight:700;color:var(--pink);background:var(--pink-soft);border:1px solid var(--pink-line);padding:5px 10px;border-radius:99px}
.icon-btn{border:1px solid var(--line);background:#fff;border-radius:10px;width:34px;height:34px;cursor:pointer;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer;transition:.15s}
.chip small{color:#94a3b8;margin-right:4px}
.chip:hover{border-color:var(--pink)}
.chip.on{background:var(--pink);border-color:var(--pink);color:#fff}
.chip.on small{color:#fbcfe8}
input[type=text],input[type=password]{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:13px 14px;font:inherit;font-size:14px;outline:none}
input:focus{border-color:var(--pink);background:#fff}
.concepts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.concept{text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px;font:inherit;cursor:pointer}
.concept b{display:block;font-size:14px;margin-bottom:3px}
.concept span{font-size:12px;color:var(--gray)}
.concept.on{border:2px solid var(--pink);background:var(--pink-soft);padding:13px}
.go{width:100%;border:0;border-radius:14px;padding:16px;background:var(--ink);color:#fff;font:inherit;font-size:15px;font-weight:800;cursor:pointer}
.go:hover{background:var(--pink)}
.go:disabled{opacity:.6;cursor:wait}
.err{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;border-radius:12px;padding:12px 14px;font-size:13px;margin-top:12px;display:none}
.mini{border:0;background:var(--ink);color:#fff;border-radius:9px;padding:8px 12px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.mini.pink{background:var(--pink)}
.mini.ok{background:#16a34a}
.box{background:var(--bg);border-radius:12px;padding:14px;font-size:14px}
.titles .t{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.titles .t:last-child{border:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tag{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 9px;font-size:12px;margin:0 6px 6px 0}
.imgbox{background:var(--pink-soft);border:1px solid var(--pink-line);border-radius:16px;padding:16px}
.prompt{background:#fff;border:1px solid var(--pink-line);border-radius:12px;padding:12px;margin-top:10px}
.prompt .top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:800;color:#831843}
.prompt pre{margin:10px 0 0;white-space:pre-wrap;font:inherit;font-size:12px;color:var(--gray);background:var(--bg);border-radius:8px;padding:10px;display:none}
.prompt.open pre{display:block}
.link{border:0;background:none;color:var(--pink);font:inherit;font-size:12px;font-weight:700;cursor:pointer;padding:0;margin-top:8px}
textarea.code{width:100%;height:220px;background:var(--ink);color:#e2e8f0;border:0;border-radius:12px;padding:14px;font:12px/1.6 ui-monospace,Consolas,monospace;resize:vertical}
.prevbar{display:flex;gap:8px;margin-bottom:10px}
.preview{border:1px solid var(--line);border-radius:14px;padding:18px;background:#fff;max-height:640px;overflow:auto;margin:0 auto;transition:max-width .2s}
.preview.mobile{max-width:390px}
.sec-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 12px}
.loading{display:none;text-align:center;padding:30px;color:var(--gray);font-size:14px}
@media(max-width:640px){.two{grid-template-columns:1fr}.concepts{grid-template-columns:1fr}.card{padding:18px}}
</style>
</head>
<body>
<div class="wrap">

  <div class="card head">
    <div>
      <h1>✨ 수익형 블로그 오토 포스터</h1>
      <div class="sub">국가별 실시간 트렌드 기반 구글 SEO 최적화 포스팅 자동 생성기</div>
    </div>
    <div class="tabs" id="tabs">
      <button class="tab on" data-geo="KR">🇰🇷 한국</button>
      <button class="tab" data-geo="US">🇺🇸 미국</button>
      <button class="tab" data-geo="JP">🇯🇵 일본</button>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <h2>📈 실시간 트렌드 Top 10</h2>
      <div style="display:flex;gap:8px;align-items:center">
        <span class="timer" id="timer">⏳ 다음 자동 갱신: 30분 00초</span>
        <button class="icon-btn" id="refresh" title="지금 새로고침">🔄</button>
      </div>
    </div>
    <div class="chips" id="chips"><span class="sub">불러오는 중…</span></div>
    <input type="text" id="keyword" placeholder="키워드 직접 입력 가능…" maxlength="100">
    <div class="err" id="trendErr"></div>
  </div>

  <div class="card">
    <h2 style="margin-bottom:14px">📝 포스팅 컨셉 설정</h2>
    <div class="concepts" id="concepts">
      <button class="concept on" data-c="deep"><b>📊 심층 분석형</b><span>깊이 있는 정보 가이드 (장문)</span></button>
      <button class="concept" data-c="summary"><b>⚡ 핵심 요약형</b><span>바쁜 현대인을 위한 요약박스 위주</span></button>
      <button class="concept" data-c="review"><b>💬 친근한 후기형</b><span>실제 경험 느낌의 구어체 &amp; Q&amp;A</span></button>
      <button class="concept" data-c="compare"><b>⚖️ 정보 비교형</b><span>장단점 비교표 및 체크리스트</span></button>
    </div>
    <div id="codeRow" style="display:none;margin-bottom:14px">
      <input type="password" id="accessCode" placeholder="접근코드 (서버에 ACCESS_CODE를 설정한 경우)">
    </div>
    <button class="go" id="go">✨ '딸깍' 포스팅 자동 생성하기</button>
    <div class="err" id="genErr"></div>
  </div>

  <div class="loading card" id="loading">⏳ 글을 쓰는 중이에요… 보통 20~40초 걸려요.</div>
  <div id="result"></div>
</div>

<script>
/* ---------- 상태 ---------- */
let geo = 'KR', concept = 'deep', keywords = [], remain = 1800, previewMobile = true;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rich = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong style="background-color:#fbcfe8;color:#333333;font-weight:800;padding:0 3px;">$1</strong>');

/* ---------- 트렌드 ---------- */
async function loadTrends() {
  $('chips').innerHTML = '<span class="sub">불러오는 중…</span>';
  $('trendErr').style.display = 'none';
  try {
    const r = await fetch('/api/trends?geo=' + geo);
    const j = await r.json();
    if (!r.ok) throw new Error(j.error);
    keywords = j.keywords;
    $('chips').innerHTML = keywords.map((k, i) =>
      `<button class="chip" data-k="${esc(k)}"><small>${i + 1}.</small>${esc(k)}</button>`).join('');
  } catch (e) {
    $('chips').innerHTML = '';
    $('trendErr').textContent = '트렌드를 가져오지 못했어요: ' + e.message + ' (키워드를 직접 입력해도 돼요)';
    $('trendErr').style.display = 'block';
  }
  remain = 1800;
}
$('chips').addEventListener('click', (e) => {
  const b = e.target.closest('.chip'); if (!b) return;
  document.querySelectorAll('.chip').forEach((c) => c.classList.remove('on'));
  b.classList.add('on'); $('keyword').value = b.dataset.k;
});
$('tabs').addEventListener('click', (e) => {
  const b = e.target.closest('.tab'); if (!b) return;
  document.querySelectorAll('.tab').forEach((t) => t.classList.remove('on'));
  b.classList.add('on'); geo = b.dataset.geo; loadTrends();
});
$('refresh').onclick = loadTrends;
setInterval(() => {
  remain--; if (remain <= 0) loadTrends();
  $('timer').textContent = `⏳ 다음 자동 갱신: ${Math.floor(remain / 60)}분 ${String(remain % 60).padStart(2, '0')}초`;
}, 1000);
$('concepts').addEventListener('click', (e) => {
  const b = e.target.closest('.concept'); if (!b) return;
  document.querySelectorAll('.concept').forEach((c) => c.classList.remove('on'));
  b.classList.add('on'); concept = b.dataset.c;
});

/* ---------- 접근코드 (선택) ---------- */
$('accessCode').value = localStorage.getItem('bap_code') || '';
$('accessCode').addEventListener('input', (e) => localStorage.setItem('bap_code', e.target.value));

/* ---------- 이미지 프롬프트 (제미나이용) ---------- */
function imagePrompt(scene, thumb) {
  return `흰색(#FFFFFF) 단색 배경의 깔끔한 2D 일러스트를 그려줘.
주제: ${scene}
- 친근하고 귀여운 일러스트풍의 한국 여성 캐릭터가 주제를 상징하는 소품과 함께 등장
- 구도(가장 중요): 캐릭터와 핵심 소품 전체를 이미지 정중앙에 배치하고 좌우·상하 여백을 대칭으로 맞추기. 한쪽으로 치우치면 안 됨
- 모든 요소가 프레임 안에 온전히 들어와야 하고(잘림 금지), 네 가장자리 모두 흰 여백을 충분히(각 15% 이상) 남기기
- 색감은 핑크(#be185d 계열), 블랙, 그레이 톤으로 통일
- 이미지 안에 글자·숫자·로고·워터마크는 넣지 않기
- 비율은 ${thumb ? '16:9 가로형' : '4:3 가로형'}`;
}

/* ---------- 티스토리용 본문 HTML (인라인 스타일, PC+모바일 공용) ---------- */
function buildPostHTML(d, forPreview) {
  const P = '#be185d', T = '#333333', G = '#475569', LINE = '#f9d0e3';
  const p = (t) => `<div style="font-size:16px;line-height:1.9;color:${T};margin:0;padding:0 0 18px;word-break:keep-all;">${rich(t)}</div>`;
  const clean = (x) => String(x || '').replace(/^[\s\d❶-❿①-⑩.)\-:·]+/, '');
  const row = (n, title, desc) => `<div style="display:flex;align-items:flex-start;gap:14px;background:#ffffff;border:1px solid ${LINE};border-radius:14px;padding:14px 16px;margin:0 0 10px;">
<div style="flex-shrink:0;width:30px;height:30px;border-radius:50%;background:${P};color:#ffffff;font-size:14px;font-weight:800;text-align:center;line-height:30px;">${n}</div>
<div style="flex:1;min-width:0;"><div style="font-size:16px;line-height:1.5;font-weight:800;color:${T};word-break:keep-all;">${rich(title)}</div>${desc ? `<div style="font-size:14px;line-height:1.6;color:${G};margin-top:3px;word-break:keep-all;">${rich(desc)}</div>` : ''}</div></div>`;
  const marker = (t) => `<div style="text-align:center;font-size:14px;font-weight:700;color:${P};padding:4px 0 22px;">${t}</div>\n`;
  let h = marker('📷 [대표 썸네일 이미지 삽입 위치] 이미지를 넣고 이 줄은 삭제하세요');

  // 1) 줄거리
  h += `<div style="background:#fdf2f8;border-left:5px solid ${P};border-radius:14px;padding:22px 24px;margin:0 0 24px;">
<strong style="font-size:17px;color:${P};display:block;margin-bottom:8px;">📖 이 글의 줄거리</strong>
<div style="font-size:15px;line-height:1.8;color:${G};margin:0;word-break:keep-all;">${rich(d.summary)}</div></div>\n`;

  // 2) 3초 요약: 소제목 한눈에 보기
  if (d.sections?.length) {
    h += `<div style="background:#f8fafc;border:1px solid ${LINE};border-radius:16px;padding:20px 18px 10px;margin:0 0 40px;">
<div style="font-size:17px;font-weight:800;color:${T};margin:0 0 14px 4px;">📌 3초 요약 <span style="color:${P};">이 글의 핵심 ${d.sections.length}가지</span></div>
${d.sections.map((s, i) => row(i + 1, clean(s.heading), s.oneLine)).join('')}</div>\n`;
  }

  // 3) 소제목 1~5 (카드뉴스형: 헤더 → 핵심 포인트 카드 → 상세 본문 → 팁)
  (d.sections || []).forEach((s, i) => {
    h += `<div style="margin:52px 0 20px;border:1px solid ${LINE};border-radius:16px;overflow:hidden;">
<div style="background:#fce7f3;padding:22px 24px;border-bottom:3px solid ${P};">
<span style="display:inline-block;background:${P};color:#ffffff;font-size:14px;font-weight:800;border-radius:99px;padding:3px 15px;">${i + 1}</span>
<div style="font-size:23px;line-height:1.45;font-weight:900;color:${T};margin-top:12px;word-break:keep-all;">${esc(s.icon || '')} ${esc(clean(s.heading))}</div></div>
<div style="background:#f8fafc;padding:16px 24px;font-size:16px;line-height:1.6;font-weight:800;color:${P};word-break:keep-all;">💡 ${rich(s.oneLine)}</div></div>\n`;

    h += marker(`📷 [소제목 ${i + 1} 이미지 삽입 위치] 이미지를 넣고 이 줄은 삭제하세요`);

    const kps = (s.keyPoints || []).map((k) => (typeof k === 'string' ? { title: k, desc: '' } : k));
    if (kps.length) {
      h += `<div style="background:#f8fafc;border-radius:16px;padding:18px 16px 8px;margin:0 0 26px;">
<div style="font-size:14px;font-weight:800;color:${P};margin:0 0 12px 4px;">✔ 핵심 포인트 ${kps.length}가지</div>
${kps.map((k, n) => row(n + 1, k.title, k.desc)).join('')}</div>\n`;
    }

    (s.body || []).forEach((t) => (h += p(t) + '\n'));

    if (s.tip) {
      h += `<div style="border:2px solid ${P};border-radius:14px;padding:16px 20px;margin:8px 0 20px;background:#ffffff;">
<strong style="font-size:14px;color:${P};">📌 이것만은 꼭!</strong>
<div style="font-size:15px;line-height:1.7;font-weight:700;color:${T};margin-top:6px;word-break:keep-all;">${rich(s.tip)}</div></div>\n`;
    }

    // 비교형: 비교표 / 체크리스트
    if (i === 2 && d.comparisonTable?.headers?.length) {
      const t = d.comparisonTable;
      h += `<div style="overflow-x:auto;margin:8px 0 24px;"><table style="width:100%;min-width:480px;border-collapse:collapse;font-size:14px;">
<thead><tr>${t.headers.map((x) => `<th style="background:#fce7f3;color:${T};padding:12px 10px;text-align:left;">${esc(x)}</th>`).join('')}</tr></thead>
<tbody>${(t.rows || []).map((r, ri) => `<tr>${r.map((c, ci) => `<td style="padding:12px 10px;border-bottom:1px solid #e2e8f0;background:${ri % 2 ? '#f8fafc' : '#ffffff'};color:${ci === 0 ? P : G};font-weight:${ci === 0 ? 700 : 400};">${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>\n`;
    }
    if (i === 3 && d.checklist?.length) {
      h += `<div style="border:2px solid ${P};border-radius:14px;padding:18px 22px;margin:8px 0 24px;">
<strong style="font-size:15px;color:${P};display:block;margin-bottom:8px;">✅ 체크리스트</strong>
${d.checklist.map((c) => `<div style="font-size:15px;line-height:1.8;color:${T};word-break:keep-all;">☐ ${esc(c)}</div>`).join('')}</div>\n`;
    }
  });

  // 4) Q&A
  if (d.qna?.length) {
    h += `<div style="margin:56px 0 20px;"><div style="font-size:22px;font-weight:900;color:${T};border-bottom:3px solid ${P};padding-bottom:10px;display:inline-block;">❓ 자주 묻는 질문 Q&amp;A</div></div>\n`;
    d.qna.forEach((x) => {
      h += `<div style="border:1px solid #e2e8f0;border-radius:14px;overflow:hidden;margin:0 0 14px;">
<div style="background:#f1f5f9;padding:14px 20px;font-size:16px;font-weight:800;color:${T};word-break:keep-all;"><span style="color:${P};">Q.</span> ${esc(x.q)}</div>
<div style="padding:16px 20px;font-size:15px;line-height:1.8;color:${T};word-break:keep-all;"><span style="color:${P};font-weight:800;">A.</span> ${rich(x.a)}</div></div>\n`;
    });
  }

  // 5) 마무리 인사
  h += `<div style="background:#fdf2f8;border:1px solid ${LINE};border-radius:16px;padding:26px;margin:48px 0 8px;text-align:center;">
<div style="font-size:18px;font-weight:800;color:${P};margin-bottom:10px;">💌 마무리 인사</div>
<div style="font-size:15px;line-height:1.9;color:${G};margin:0;word-break:keep-all;">${rich(d.closing)}</div></div>\n`;
  return h;
}

/* ---------- 복사 ---------- */
async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); }
  catch { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
  if (btn) { const o = btn.textContent; btn.classList.add('ok'); btn.textContent = '복사됨 ✓'; setTimeout(() => { btn.classList.remove('ok'); btn.textContent = o; }, 1400); }
}

/* ---------- 결과 렌더 ---------- */
let current = null, currentHTML = '';
function promptBlock(label, scene, thumb, id, where) {
  const text = imagePrompt(scene, thumb);
  return `<div class="prompt" id="pr-${id}"><div class="top"><span>✨ ${esc(label)}</span>
<button class="mini pink" data-copy="${esc(text)}">프롬프트 복사</button></div>
<div class="sub" style="margin-top:6px">📍 ${esc(where || '')}</div>
<button class="link" data-toggle="pr-${id}">프롬프트 내용 보기</button><pre>${esc(text)}</pre></div>`;
}
function renderResult(d, count) {
  current = d; currentHTML = buildPostHTML(d, false);
  const tags = (d.tags || []).slice(0, 10);
  $('result').innerHTML = `
<div class="card">
  <h2 style="margin-bottom:6px;font-size:20px">🎉 포스팅 생성 완료!</h2>
  <div class="sub" style="margin-bottom:16px">본문 약 ${(count || 0).toLocaleString()}자 (공백 제외)</div>

  <h3>📌 CTR 높이는 추천 제목</h3>
  <div class="box titles" style="margin-bottom:18px">${d.titles.map((t, i) =>
    `<div class="t"><span>${i + 1}. ${esc(t)}</span><button class="mini" data-copy="${esc(t)}">복사</button></div>`).join('')}</div>

  <div class="two" style="margin-bottom:18px">
    <div><div class="sec-title"><h3 style="margin:0">📝 메타 요약문</h3><button class="mini" data-copy="${esc(d.meta || '')}">복사</button></div>
      <div class="box" style="font-size:13px;color:var(--gray)">${esc(d.meta || '')}</div></div>
    <div><div class="sec-title"><h3 style="margin:0">🏷️ 추천 태그 (${tags.length}개)</h3><button class="mini pink" data-copy="${esc(tags.join(','))}">태그 전체 복사</button></div>
      <div class="box">${tags.map((t) => `<span class="tag">${esc(t)}</span>`).join('')}</div></div>
  </div>

  <div class="imgbox" style="margin-bottom:18px">
    <h3 style="color:#831843;font-size:15px">🎨 추천 이미지 가이드 (제미나이 전용)</h3>
    <div class="sub" style="color:#9d174d">본문 코드에 <b>📷 [이미지 삽입 위치]</b> 줄이 있어요. 그 자리에 이미지를 넣고 안내 줄은 지워 주세요.</div>
    ${promptBlock('[대표 썸네일] 이미지 프롬프트', d.thumbnailScene || d.titles[0], true, 'thumb', '넣을 위치: 글 맨 위 📷 표시 (티스토리 대표 이미지로도 설정)')}
    <div style="margin:16px 0 0;font-size:13px;font-weight:800;color:#831843">📌 소제목별 이미지</div>
    ${d.sections.map((s, i) => promptBlock(`소제목 ${i + 1}: ${s.heading}`, s.imageScene || s.heading, false, i, `넣을 위치: 본문 ${i + 1}번 소제목 카드 바로 아래 📷 표시`)).join('')}
  </div>

  <div class="sec-title"><h3 style="margin:0">📖 본문 HTML 코드 <span class="sub">(티스토리 HTML 모드에 붙여넣기)</span></h3><button class="mini" id="copyHtml">코드 복사</button></div>
  <textarea class="code" readonly id="htmlCode"></textarea>

  <h3 style="margin:22px 0 10px">📱 미리보기</h3>
  <div class="prevbar">
    <button class="mini ${previewMobile ? 'pink' : ''}" data-view="mobile">모바일</button>
    <button class="mini ${previewMobile ? '' : 'pink'}" data-view="pc">PC</button>
  </div>
  <div class="preview ${previewMobile ? 'mobile' : ''}" id="preview"></div>
</div>`;
  $('htmlCode').value = currentHTML;
  $('preview').innerHTML = buildPostHTML(d, true);
  $('copyHtml').onclick = (e) => copy(currentHTML, e.target);
  $('result').scrollIntoView({ behavior: 'smooth' });
}
$('result').addEventListener('click', (e) => {
  const c = e.target.closest('[data-copy]'); if (c) return copy(c.dataset.copy, c);
  const t = e.target.closest('[data-toggle]');
  if (t) { const el = $(t.dataset.toggle); el.classList.toggle('open'); t.textContent = el.classList.contains('open') ? '프롬프트 내용 접기' : '프롬프트 내용 보기'; return; }
  const v = e.target.closest('[data-view]');
  if (v) { previewMobile = v.dataset.view === 'mobile'; $('preview').classList.toggle('mobile', previewMobile);
    document.querySelectorAll('[data-view]').forEach((b) => b.classList.toggle('pink', (b.dataset.view === 'mobile') === previewMobile)); }
});

/* ---------- 생성 ---------- */
$('go').onclick = async () => {
  const kw = $('keyword').value.trim();
  $('genErr').style.display = 'none';
  if (!kw) { $('genErr').textContent = '키워드를 선택하거나 입력해 주세요.'; $('genErr').style.display = 'block'; return; }
  $('go').disabled = true; $('go').textContent = '⏳ 생성 중…'; $('loading').style.display = 'block'; $('result').innerHTML = '';
  try {
    const r = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-access-code': $('accessCode').value },
      body: JSON.stringify({ keyword: kw, concept, geo }),
    });
    const j = await r.json();
    if (r.status === 401) $('codeRow').style.display = 'block';
    if (!r.ok) throw new Error(j.error || '생성 실패');
    renderResult(j.data, j.charCount);
  } catch (e) {
    $('genErr').textContent = e.message; $('genErr').style.display = 'block';
  } finally {
    $('go').disabled = false; $('go').textContent = "✨ '딸깍' 포스팅 자동 생성하기"; $('loading').style.display = 'none';
  }
};

loadTrends();
</script>
</body>
</html>
